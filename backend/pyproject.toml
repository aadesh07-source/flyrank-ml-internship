[project]
name = "ctr-opportunity-scoring"
version = "0.1.0"
description = "CTR & Engagement Opportunity Scoring for Search Content — FlyRank ML Capstone"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2,<3",
    "duckdb>=0.10,<2",
    "pandas>=2.1,<3",
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
    "scipy>=1.12,<2",
    "joblib>=1.3,<2",
    "huggingface_hub>=0.21,<1",
    "PyYAML>=6,<7",
    "pyarrow>=15,<20",
]

[project.optional-dependencies]
lgbm = ["lightgbm>=4,<5"]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "ruff>=0.3",
    "black>=24",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["."]

[tool.pyrefly]
search-path = [".", "..", "backend"]
ignore-missing-imports = ["app.*", "pipeline.*"]
